[workspace]
resolver = "3"
members = [
    ".",
    "crates/moonly_core",
    "crates/moonly_render",
    "crates/moonly_cull",
    "crates/moonly_shadows",
    "crates/moonly_gi",
    "crates/moonly_volumetrics",
    "crates/moonly_post",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "3d",
    "ui",
    "bevy_gltf",
    "ktx2",
    "png",
    "zstd_rust",
] }
criterion = "0.8.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
wesl = "0.3"
wgpu = "30.0.1"

moonly_core = { path = "crates/moonly_core" }
moonly_render = { path = "crates/moonly_render" }
moonly_cull = { path = "crates/moonly_cull" }
moonly_shadows = { path = "crates/moonly_shadows" }
moonly_gi = { path = "crates/moonly_gi" }
moonly_volumetrics = { path = "crates/moonly_volumetrics" }
moonly_post = { path = "crates/moonly_post" }

[package]
name = "moonly"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bench]]
name = "lighting"
path = "benches/lighting.rs"
harness = false

[[bench]]
name = "gi"
path = "benches/gi.rs"
harness = false

[[example]]
name = "monolith_showcase"
path = "examples/monolith_showcase.rs"

[[example]]
name = "gi_shadows_lab"
path = "examples/gi_shadows_lab.rs"

[[example]]
name = "bevy_lighting"
path = "examples/bevy_lighting.rs"

[[example]]
name = "bevy_spotlight"
path = "examples/bevy_spotlight.rs"

[[example]]
name = "bevy_transmission"
path = "examples/bevy_transmission.rs"

[[example]]
name = "bevy_bloom_3d"
path = "examples/bevy_bloom_3d.rs"

[[example]]
name = "bevy_volumetric_fog"
path = "examples/bevy_volumetric_fog.rs"

[[example]]
name = "bevy_tonemapping"
path = "examples/bevy_tonemapping.rs"

[[example]]
name = "bevy_many_lights"
path = "examples/bevy_many_lights.rs"

[[example]]
name = "bevy_many_cameras_lights"
path = "examples/bevy_many_cameras_lights.rs"

[features]
webgpu = ["bevy/webgpu"]
exr = ["bevy/exr"]
hdr = ["bevy/hdr"]

[dependencies]
bevy.workspace = true
moonly_core.workspace = true
moonly_render.workspace = true
moonly_cull.workspace = true
moonly_shadows.workspace = true
moonly_gi.workspace = true
moonly_volumetrics.workspace = true
moonly_post.workspace = true

[build-dependencies]
wesl.workspace = true

[dev-dependencies]
criterion.workspace = true
image.workspace = true
wesl.workspace = true
rand = "0.10.0"
chacha20 = { version = "0.10.0", default-features = false, features = ["rng"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

[profile.bench]
inherits = "dev"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "allow"
unused_qualifications = "warn"
unreachable_pub = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "warn"
print_stdout = "allow"
print_stderr = "allow"

cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
type_complexity = "warn"

needless_pass_by_value = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
many_single_char_names = "allow"
suboptimal_flops = "allow"
redundant_pub_crate = "allow"
option_if_let_else = "allow"

[lints]
workspace = true
